<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전직 레벨업 재화 계산기</title>

<style>
:root {
  color-scheme: dark;
  --bg: #10131a;
  --panel: #1a202b;
  --line: #303b4b;
  --text: #f3f5f8;
  --muted: #aeb8c8;
  --accent: #f5d90a;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
  padding: 24px;
}

main {
  max-width: 980px;
  margin: auto;
}

h1 {
  font-size: clamp(24px, 4vw, 34px);
  margin: 0 0 8px;
}

.intro {
  color: var(--muted);
  margin: 0 0 24px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px;
}

h2 {
  font-size: 18px;
  margin: 0 0 16px;
}

.fields {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

label {
  display: block;
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 6px;
}

input {
  width: 100%;
  background: #0e1218;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--text);
  padding: 11px;
  font-size: 16px;
}

.wide {
  grid-column: 1 / -1;
}

/* 전직 차수 버튼 */

.tier-buttons {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.tier-button {
  margin: 0;
  padding: 13px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #0e1218;
  color: var(--text);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

.tier-button.active {
  background: var(--accent);
  color: #171717;
  border-color: var(--accent);
}

/* 계산 결과 */

.results {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 16px;
}

.result {
  background: #0e1218;
  border: 1px solid var(--line);
  padding: 14px;
  border-radius: 10px;
}

.result span {
  display: block;
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 6px;
}

.result strong {
  font-size: clamp(18px, 3vw, 26px);
  overflow-wrap: anywhere;
}

.highlight {
  border-color: #817400;
}

.highlight strong {
  color: var(--accent);
}

button.action {
  border: 0;
  border-radius: 9px;
  background: var(--accent);
  color: #171717;
  font-weight: 700;
  padding: 12px 18px;
  font-size: 15px;
  cursor: pointer;
  margin-top: 16px;
}

button.secondary {
  background: #303b4b;
  color: var(--text);
  margin-left: 8px;
}

.note {
  font-size: 12px;
  line-height: 1.6;
  color: var(--muted);
  margin-top: 12px;
}

.status {
  font-size: 14px;
  color: var(--accent);
  margin-top: 10px;
}

@media (max-width: 680px) {
  body {
    padding: 14px;
  }

  .grid,
  .fields,
  .results {
    grid-template-columns: 1fr;
  }

  .wide {
    grid-column: auto;
  }
}
</style>
</head>

<body>
<main>

<h1>전직 레벨업 재화 계산기</h1>

<p class="intro">
전직 차수와 레벨 범위, 보유 재화 및 소탕 열쇠를 입력해 필요 재화와 열쇠를 계산합니다.
</p>

<div class="grid">

<section class="panel">
<h2>레벨 범위 및 보유 재화</h2>

<div class="fields">

<div class="wide">
<label>전직 차수</label>

<div class="tier-buttons">
<button type="button" class="tier-button active" data-tier="1">1차</button>
<button type="button" class="tier-button" data-tier="2">2차</button>
<button type="button" class="tier-button" data-tier="3">3차</button>
</div>

<input type="hidden" id="tier" value="1">
</div>

<div>
<label for="currentLevel">현재 전직 레벨</label>
<input id="currentLevel" type="number" min="1" max="95" value="35">
</div>

<div>
<label for="targetLevel">목표 전직 레벨</label>
<input id="targetLevel" type="number" min="1" max="95" value="50">
</div>

<div class="wide">
<label for="owned">기존 보유 재화</label>
<input id="owned" type="number" min="0" value="0">
</div>

</div>
</section>

<section class="panel">
<h2>소탕 수급 재화</h2>

<div class="fields">

<div>
<label id="towerRewardLabel" for="towerReward">시련의 탑 소탕 1회 재화</label>
<input id="towerReward" type="number" min="0" value="0">
</div>

<div>
<label id="towerKeysLabel" for="towerKeys">시련의 탑 보유 열쇠</label>
<input id="towerKeys" type="number" min="0" value="0">
</div>

<div id="dungeonRewardWrap">
<label id="dungeonRewardLabel" for="dungeonReward">보물던전 1 소탕 1회 재화</label>
<input id="dungeonReward" type="number" min="0" value="0">
</div>

<div id="dungeonKeysWrap">
<label id="dungeonKeysLabel" for="dungeonKeys">보물던전 1 보유 열쇠</label>
<input id="dungeonKeys" type="number" min="0" value="0">
</div>

</div>
</section>

</div>

<section class="panel" style="margin-top:16px">

<h2>계산 결과</h2>

<div class="results">

<div class="result">
<span>현재 수급 가능 총 재화</span>
<strong id="totalAvailable">0</strong>
</div>

<div class="result">
<span>목표 레벨까지 필요 재화</span>
<strong id="required">0</strong>
</div>

<div class="result">
<span>부족 재화</span>
<strong id="shortage">0</strong>
</div>

<div class="result highlight">
<span id="keysNeededLabel">추가로 필요한 보물던전 1 열쇠</span>
<strong id="keysNeeded">0개</strong>
</div>

</div>

<div class="status" id="status"></div>

<p class="note" id="note">
현재 레벨 다음 단계부터 목표 레벨까지 필요한 재화를 합산합니다.
</p>

<button type="button" class="action" id="calculateButton">계산하기</button>
<button type="button" class="action secondary" id="resetButton">초기화</button>

</section>

</main>

<script>

// =====================================
// 1차 전직 비용 (레벨 1~95)
// =====================================

const costs1 = [
1000,1500,2000,2500,3000,3500,4000,4500,5000,5500,
8000,10500,13000,15500,18000,20500,23000,25500,28000,30500,
35000,39500,44000,48500,53000,57500,62000,66500,71000,75500,
80000,90000,100000,110000,120000,130000,140000,150000,160000,170000,
190000,210000,230000,250000,270000,290000,310000,330000,350000,370000,
400000,450000,500000,550000,600000,650000,700000,750000,800000,1000000,
1250000,1500000,1750000,2000000,2250000,2500000,2750000,3000000,3250000,3500000,
4000000,4500000,5000000,5500000,6000000,6500000,7000000,7500000,8000000,8500000,
9000000,9500000,10000000,11000000,12000000,13000000,14000000,15000000,16000000,17000000,
18000000,19000000,20000000,21000000,22000000
];

// =====================================
// 2차 전직 비용 (레벨 0~100)
// =====================================

const costs2 = [
1000,1500,2000,2500,3000,3500,4000,4500,5000,5500,
6000,6500,7000,7500,8000,8500,9000,9500,10000,11000,
12000,13000,14000,15000,16000,17000,18000,19000,20000,25000,
30000,35000,40000,45000,50000,55000,60000,65000,70000,75000,
80000,85000,90000,95000,100000,105000,110000,115000,120000,125000,
130000,135000,140000,145000,150000,155000,160000,165000,170000,175000,
180000,185000,190000,195000,200000,210000,220000,230000,240000,250000,
260000,270000,280000,290000,300000,310000,320000,330000,340000,350000,
360000,370000,380000,390000,400000,410000,420000,430000,440000,450000,
460000,470000,480000,490000,500000,510000,520000,530000,540000,550000,
560000
];

// =====================================
// 3차 전직 비용 (레벨 1~45)
// =====================================

const costs3 = [
2000,4000,6000,8000,10000,12000,14000,16000,18000,20000,
22000,24000,26000,28000,30000,34000,42000,44000,46000,48000,
50000,60000,70000,80000,100000,110000,120000,130000,140000,150000,
170000,190000,210000,230000,250000,300000,350000,400000,450000,500000,
600000,700000,800000,900000,1000000
];

// =====================================
// 공통 함수
// =====================================

function getNumber(id) {
  const value = Number(document.getElementById(id).value);
  return Number.isFinite(value) && value > 0 ? value : 0;
}

function formatNumber(value) {
  return Math.floor(value).toLocaleString('ko-KR');
}

function getTier() {
  return document.getElementById('tier').value;
}

// =====================================
// 전직별 레벨 제한 및 비용 데이터
// =====================================

function getLimits() {

  const tier = getTier();

  if (tier === '1') {
    return {
      min: 1,
      max: 95,
      costs: costs1
    };
  }

  if (tier === '2') {
    return {
      min: 0,
      max: 100,
      costs: costs2
    };
  }

  return {
    min: 1,
    max: 45,
    costs: costs3
  };
}

// =====================================
// 전직 버튼 및 던전 명칭 변경
// =====================================

function updateTier() {

  const tier = getTier();
  const limits = getLimits();

  const currentLevel = document.getElementById('currentLevel');
  const targetLevel = document.getElementById('targetLevel');

  currentLevel.min = limits.min;
  currentLevel.max = limits.max;

  targetLevel.min = limits.min;
  targetLevel.max = limits.max;

  let current = Number(currentLevel.value);

  if (!Number.isFinite(current)) {
    current = limits.min;
  }

  current = Math.min(limits.max, Math.max(limits.min, current));

  currentLevel.value = current;

  let target = Number(targetLevel.value);

  if (!Number.isFinite(target)) {
    target = current;
  }

  target = Math.min(limits.max, Math.max(current, target));

  targetLevel.value = target;

  const towerRewardLabel = document.getElementById('towerRewardLabel');
  const towerKeysLabel = document.getElementById('towerKeysLabel');

  const dungeonRewardLabel = document.getElementById('dungeonRewardLabel');
  const dungeonKeysLabel = document.getElementById('dungeonKeysLabel');

  const dungeonRewardWrap = document.getElementById('dungeonRewardWrap');
  const dungeonKeysWrap = document.getElementById('dungeonKeysWrap');

  const keysNeededLabel = document.getElementById('keysNeededLabel');
  const note = document.getElementById('note');

  if (tier === '1') {

    towerRewardLabel.textContent = '시련의 탑 소탕 1회 재화';
    towerKeysLabel.textContent = '시련의 탑 보유 열쇠';

    dungeonRewardLabel.textContent = '보물던전 1 소탕 1회 재화';
    dungeonKeysLabel.textContent = '보물던전 1 보유 열쇠';

    keysNeededLabel.textContent = '추가로 필요한 보물던전 1 열쇠';

    dungeonRewardWrap.style.display = '';
    dungeonKeysWrap.style.display = '';

    note.textContent =
      '1차: 보유 재화 + 시련의 탑 수급 재화 + 보물던전 1 수급 재화를 계산합니다.';

  } else if (tier === '2') {

    towerRewardLabel.textContent = '극한의 탑 소탕 1회 재화';
    towerKeysLabel.textContent = '극한의 탑 보유 열쇠';

    dungeonRewardLabel.textContent = '보물던전 2 소탕 1회 재화';
    dungeonKeysLabel.textContent = '보물던전 2 보유 열쇠';

    keysNeededLabel.textContent = '추가로 필요한 보물던전 2 열쇠';

    dungeonRewardWrap.style.display = '';
    dungeonKeysWrap.style.display = '';

    note.textContent =
      '2차: 보유 재화 + 극한의 탑 수급 재화 + 보물던전 2 수급 재화를 계산합니다.';

  } else {

    towerRewardLabel.textContent = '절망의 탑 소탕 1회 재화';
    towerKeysLabel.textContent = '절망의 탑 보유 열쇠';

    keysNeededLabel.textContent = '추가로 필요한 절망의 탑 열쇠';

    dungeonRewardWrap.style.display = 'none';
    dungeonKeysWrap.style.display = 'none';

    note.textContent =
      '3차: 보유 재화 + 절망의 탑 수급 재화만 계산합니다.';
  }

  calculate();
}

// =====================================
// 총 수급 가능 재화 계산
// =====================================

function calculate() {

  const tier = getTier();
  const limits = getLimits();

  const currentLevel = Math.floor(
    Number(document.getElementById('currentLevel').value)
  );

  const targetLevel = Math.floor(
    Number(document.getElementById('targetLevel').value)
  );

  const owned = getNumber('owned');

  const towerReward = getNumber('towerReward');
  const towerKeys = getNumber('towerKeys');

  const dungeonReward = getNumber('dungeonReward');
  const dungeonKeys = getNumber('dungeonKeys');

  // 현재 보유 재화
  let available = owned;

  // 1차 전직
  if (tier === '1') {

    available += towerReward * towerKeys;

    available += dungeonReward * dungeonKeys;

  }

  // 2차 전직
  else if (tier === '2') {

    available += towerReward * towerKeys;

    available += dungeonReward * dungeonKeys;

  }

  // 3차 전직
  else if (tier === '3') {

    available += towerReward * towerKeys;

  }

  // 레벨 범위 검사
  if (
    !Number.isFinite(currentLevel) ||
    !Number.isFinite(targetLevel) ||
    currentLevel < limits.min ||
    currentLevel > limits.max ||
    targetLevel < currentLevel ||
    targetLevel > limits.max
  ) {

    document.getElementById('status').textContent =
      `레벨 범위를 확인하세요. 현재 레벨은 ${limits.min}~${limits.max}이며 목표 레벨은 현재 레벨 이상이어야 합니다.`;

    document.getElementById('totalAvailable').textContent = '—';
    document.getElementById('required').textContent = '—';
    document.getElementById('shortage').textContent = '—';
    document.getElementById('keysNeeded').textContent = '—';

    return;
  }

  // 목표 레벨까지 필요 재화
  let required = 0;

  for (
    let level = currentLevel + 1;
    level <= targetLevel;
    level++
  ) {

    let index;

    if (tier === '1') {
      index = level - 1;
    } else {
      index = level;
    }

    const cost = limits.costs[index];

    if (cost === undefined) {

      document.getElementById('status').textContent =
        '해당 레벨의 재화 비용 데이터가 없습니다.';

      return;
    }

    required += cost;
  }

  // 부족 재화
  const shortage = Math.max(0, required - available);

  // 추가로 필요한 열쇠 계산
  let rewardForExtraKeys;

  if (tier === '1') {
    rewardForExtraKeys = dungeonReward;
  } else if (tier === '2') {
    rewardForExtraKeys = dungeonReward;
  } else {
    rewardForExtraKeys = towerReward;
  }

  let keysNeeded;

  if (shortage === 0) {
    keysNeeded = 0;
  } else if (rewardForExtraKeys > 0) {
    keysNeeded = Math.ceil(shortage / rewardForExtraKeys);
  } else {
    keysNeeded = null;
  }

  // 결과 표시
  document.getElementById('totalAvailable').textContent =
    formatNumber(available);

  document.getElementById('required').textContent =
    formatNumber(required);

  document.getElementById('shortage').textContent =
    formatNumber(shortage);

  document.getElementById('keysNeeded').textContent =
    keysNeeded === null
      ? '소탕 재화 입력 필요'
      : formatNumber(keysNeeded) + '개';

  document.getElementById('status').textContent =
    shortage === 0
      ? '현재 수급 가능 재화로 목표 레벨까지 올릴 수 있습니다.'
      : '현재 재화 기준으로 부족분을 추가 수급해야 합니다.';
}

// =====================================
// 초기화
// =====================================

function resetValues() {

  document.getElementById('tier').value = '1';

  document.getElementById('currentLevel').value = 1;
  document.getElementById('targetLevel').value = 1;

  document.getElementById('owned').value = 0;

  document.getElementById('towerReward').value = 0;
  document.getElementById('towerKeys').value = 0;

  document.getElementById('dungeonReward').value = 0;
  document.getElementById('dungeonKeys').value = 0;

  document.querySelectorAll('.tier-button').forEach(button => {

    button.classList.toggle(
      'active',
      button.dataset.tier === '1'
    );

  });

  updateTier();
}

// =====================================
// 전직 버튼 이벤트
// =====================================

document.querySelectorAll('.tier-button').forEach(button => {

  button.addEventListener('click', function() {

    const selectedTier = this.dataset.tier;

    document.getElementById('tier').value = selectedTier;

    document.querySelectorAll('.tier-button').forEach(btn => {
      btn.classList.toggle('active', btn === this);
    });

    updateTier();

  });

});

// =====================================
// 입력 변경 이벤트
// =====================================

document.querySelectorAll('input[type="number"]').forEach(input => {

  input.addEventListener('input', calculate);

});

document.getElementById('calculateButton').addEventListener(
  'click',
  calculate
);

document.getElementById('resetButton').addEventListener(
  'click',
  resetValues
);

// 최초 실행
updateTier();

</script>
</body>
</html>
